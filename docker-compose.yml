services:
  api:
    build: .
    container_name: drone_mapping_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Drone Mapping API"
      APP_ENV: development
      DEBUG: "true"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://drone_user:drone_password@postgres:5432/drone_mapping
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      AI_MODEL_NAME: aerial_mapping_yolo
      AI_MODEL_VERSION: 1.0.0
      MAX_IMAGE_SIZE_MB: "50"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: drone_mapping_postgres
    environment:
      POSTGRES_DB: drone_mapping
      POSTGRES_USER: drone_user
      POSTGRES_PASSWORD: drone_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_user -d drone_mapping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: drone_mapping_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
